<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CelularHub — Compra e venda de celulares</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container bar">
        <button class="logo" data-go="home">Fort<span class="cell">Cell</span></button>
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <nav class="nav" id="nav">
          <button data-go="home">Início</button>
          <button data-go="new">Anunciar</button>
          <button data-go="favs">Favoritos</button>
          <button data-go="profile">Perfil</button>
          <button id="authBtn" class="btn">Entrar</button>
        </nav>
      </div>
    </header>
    <main class="container" id="app"></main>
    <footer class="footer">© 2026 FortCell</footer>
    <script src="script.js"></script>
  </body>
</html>
